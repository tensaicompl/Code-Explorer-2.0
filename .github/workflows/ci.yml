name: ci

on:
  push:
    branches: ["main", "task/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4

      # The toolchain file pins the version; rustup on the runner honours it.
      - name: Show toolchain
        run: |
          rustup show
          cc --version || true
          cmake --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: Install the dependency policy checker
        run: command -v cargo-deny >/dev/null || cargo install --locked cargo-deny

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc

      - name: Enable the pinned package manager
        # The pinned version is declared in the interface's own manifest, so
        # corepack has to read it from there rather than from the repository root.
        working-directory: ui
        run: corepack enable && corepack prepare --activate

      - name: Install interface dependencies
        run: make ui-install

      - name: check
        run: make check

  windows-binary:
    # Windows carries the local binary only: the server is not supported there.
    name: build the binary (windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build
        run: cargo build -p pdx --no-default-features
      - name: Test
        run: cargo test -p pdx --no-default-features
