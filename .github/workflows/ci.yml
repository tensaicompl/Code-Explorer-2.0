name: ci

on:
  push:
    branches: ["main", "task/**", "review/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4

      # The toolchain file pins the version; rustup on the runner honours it.
      - name: Show toolchain
        run: |
          rustup show
          cc --version || true
          cmake --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: Install the dependency policy checker
        run: command -v cargo-deny >/dev/null || cargo install --locked cargo-deny

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc

      - name: Enable the pinned package manager
        # The pinned version is declared in the interface's own manifest, so
        # corepack has to read it from there rather than from the repository root.
        working-directory: ui
        run: corepack enable && corepack prepare --activate

      - name: Install interface dependencies
        run: make ui-install

      - name: check
        run: make check

  # Every third-party crate in Cargo.lock must be covered by supply-chain/ (Part 5.12,
  # issue 36). One Linux job: the store is the same on every system, so cargo-vet is
  # built once. It only verifies; nothing here accepts a crate.
  supply-chain:
    name: supply chain (cargo vet)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-vet
          key: cargo-vet-${{ hashFiles('scripts/cargo-vet.sh', 'rust-toolchain.toml') }}
      - name: Install the pinned cargo-vet
        run: scripts/cargo-vet.sh install
      - name: cargo vet
        run: make vet

  windows-binary:
    # Windows carries the local binary only: the server is not supported there.
    name: build the binary (windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-windows-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      # The engine is built with clang on Windows, never Microsoft's compiler, and
      # with Ninja, since the Visual Studio generators always drive that compiler. The
      # binary links the engine, so this comes before the first build.
      - name: Show the engine toolchain
        shell: bash
        run: |
          clang --version
          cmake --version
          ninja --version || { pip install ninja && ninja --version; }
      - name: Build
        run: cargo build -p pdx --no-default-features
      # Built without dev-dependencies, as a release is: the engine's test switches
      # must not be in it.
      - name: The binary carries no test switches
        shell: bash
        run: scripts/no-test-switches.sh target/debug/pdx.exe
      - name: Test
        run: cargo test -p pdx --no-default-features
      - name: Test the engine through its bindings
        run: cargo test -p pdx-engine-sys
      - name: Test the safe engine interface
        run: cargo test -p pdx-engine
      # The graph model and segments: a segment's read-only attribute, the URI it is
      # opened by and the path it is written to all differ on Windows.
      - name: Test the graph model and segments
        run: cargo test -p pdx-core
