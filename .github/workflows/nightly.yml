name: nightly

on:
  schedule:
    # Early enough that the results are waiting at the start of the day.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check-full:
    name: check-full
    runs-on: ubuntu-24.04
    # The accuracy and scale suites are long; they are why this is not on push.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustup show

      # Restored here and saved at the end whatever happened, so a red night does not
      # fetch every golden and scale repository again the next.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-vet
            target
            bench/.cache
          key: nightly-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'bench/repos.lock') }}
          restore-keys: nightly-

      - name: Install the pinned dependency policy checker
        run: scripts/cargo-deny.sh install

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc

      - name: Enable the pinned package manager
        # The pinned version is declared in the interface's own manifest, so
        # corepack has to read it from there rather than from the repository root.
        working-directory: ui
        run: corepack enable && corepack prepare --activate

      - name: Install interface dependencies
        run: make ui-install

      # check-full, one suite a step, each run whatever the one before it did: a failing
      # golden never hides the sanitizers, determinism or the engine differential.
      - name: check
        run: make check
      - name: golden
        if: always()
        run: make golden
      - name: sanitizers
        if: always()
        run: make check-asan
      - name: determinism
        if: always()
        run: make determinism
      - name: engine differential
        if: always()
        run: make engine-differential
      - name: performance
        if: always()
        run: make perf

      # The same supply-chain checks as every push (ci.yml), on what is built tonight.
      - name: Install the pinned cargo-vet
        if: always()
        run: scripts/cargo-vet.sh install

      - name: cargo vet
        if: always()
        run: make vet

      - name: cargo deny
        if: always()
        run: make deny

      - name: Save the caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-vet
            target
            bench/.cache
          key: nightly-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'bench/repos.lock') }}-${{ github.run_id }}

      - name: Publish the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/
          if-no-files-found: ignore
