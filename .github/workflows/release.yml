name: release

# Skeleton. The release task fills in the build matrix, the bills of material, the
# provenance attestations, the signatures, the checksums, the container images, the
# chart package and the accuracy page. Until then this workflow only verifies that
# a tag builds and passes `make check` and the supply-chain checks, so a tag is never
# published untested.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the artefacts without publishing them
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Show toolchain
        run: rustup show
      - name: Install the pinned dependency policy checker
        run: scripts/cargo-deny.sh install
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ui/.nvmrc
      - name: Enable the pinned package manager
        # The pinned version is declared in the interface's own manifest, so
        # corepack has to read it from there rather than from the repository root.
        working-directory: ui
        run: corepack enable && corepack prepare --activate
      - name: Install interface dependencies
        run: make ui-install
      - name: check
        run: make check
      # A tag ships only what the supply-chain store covers, checked as on every push.
      - name: Install the pinned cargo-vet
        run: scripts/cargo-vet.sh install
      - name: cargo vet
        run: make vet
      - name: cargo deny
        run: make deny
      # Built as it ships, without dev-dependencies: the engine's test switches, which
      # let an environment variable crash it, must not be in it.
      - name: Build the release binary
        run: cargo build --release -p pdx --no-default-features
      - name: The release binary carries no test switches
        run: scripts/no-test-switches.sh target/release/pdx
