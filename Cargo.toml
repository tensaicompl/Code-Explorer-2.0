[workspace]
resolver = "3"
members = [
  "crates/pdx-engine-sys",
  "crates/pdx-engine",
  "crates/pdx-core",
  "crates/pdx-precise",
  "crates/pdx-mcp",
  "crates/pdx-bench",
  "crates/pdx",
  "crates/pdx-arch",
  "crates/pdx-analytics",
  "crates/pdx-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Praxevia"]
repository = "https://github.com/tensaicompl/Code-Explorer-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
