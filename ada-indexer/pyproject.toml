[project]
name = "pdx-ada-indexer"
version = "0.1.0"
description = "Emits a compiler-grade index for Ada sources from a project file."
requires-python = ">=3.12,<3.13"
readme = "README.md"
authors = [{ name = "Praxevia" }]
dependencies = []

# Packaged and distributed separately from the rest of the repository: it runs as
# its own process, against a toolchain whose own licence governs it. The licence
# recorded for that toolchain at reference-pinning time is Apache-2.0 with LLVM
# exceptions.
[project.license]
text = "Apache-2.0"

[project.scripts]
pdx-ada-indexer = "pdx_ada_indexer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdx_ada_indexer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
