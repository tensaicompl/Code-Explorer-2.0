# The engine differential's corpora (P2-16, decision 50): what make engine-differential
# runs the vendored engine and the pinned, unmodified reference engine over, and
# compares row for row. pdx-bench differential-corpora checks this file against the
# language matrix and bench/repos.lock; scripts/engine/differential.py runs it.
#
# Every corpus is an explicit, sorted list of files, never discovered, so a change in
# what is compared is a reviewed change to this file.
#
#   [[fixture]]  every typed-resolution fixture of engine/tests/fixtures/resolve, every
#                file listed: compared sources, and support files staged for the engines
#                but never compared (pdx-metadata.txt for the vendored engine and the
#                native manifest it stands for, which the reference reads). Every
#                typed-tier language has at least one.
#   [[golden]]   a bounded cluster of related files of every typed-tier golden
#                repository, at the commit bench/repos.lock pins; only paths are
#                committed, never source. A subset stages its sources alone, so neither
#                engine receives repository metadata; each cluster's relations need none
#                (one Go package, Python relative imports, TypeScript relative imports, a
#                Rust crate's modules, Java and Kotlin packages, C# namespaces, C and
#                C++ includes within the subset). A C or C++ file is at most 32 KiB, where
#                patch 0012's evaluation budget equals the reference's.

format = 1

[[fixture]]
name = "c_header_include"
language = "c"
root = "engine/tests/fixtures/resolve/c_header_include"
files = [
    "include/util.h",
