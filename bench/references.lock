# Reference lock file
#
# Every reference this project takes code, algorithms or packages from, pinned to
# the exact commit observed at the fetch date, with the licence verified by
# reading the reference's own licence file at that time. The vendoring and port
# scripts resolve nothing dynamically: they use these commits.
#
# This file is excluded from the provenance scan, because naming the upstream is
# its whole purpose. Nowhere else in the tree may do so.
#
# Refreshing a pin is a task of its own; it re-runs the vendoring scripts at the
# new commit and must produce a zero-diff tree at the old one.

lock_version = 1
fetch_date = "2026-09-27"

# Licences permitted for inclusion or dependency. Anything else is forbidden for
# inclusion; copyleft software may only be invoked as a separate process.
licence_allow_list = [
  "MIT", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0", "Zlib",
  "MPL-2.0", "Unlicense", "CC0-1.0", "0BSD",
]

