# Golden repositories are indexed on every benchmark run and their expected
# graphs are committed. Scale repositories are indexed nightly only, for timing
# and memory, and no source is ever copied out of them.
#
# Pinned to the commit observed as the default-branch head at the fetch date, so
# that accuracy numbers are comparable across releases.

