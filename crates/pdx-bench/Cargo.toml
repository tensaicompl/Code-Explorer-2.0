[package]
name = "pdx-bench"
description = "The benchmark harness: accuracy, timing and determinism."
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[[bin]]
name = "pdx-bench"
path = "src/main.rs"

[dependencies]
# `pdx-bench golden [--accept]`: the builder API with the features `pdx` uses (issue 70),
# so no colour, suggestions or wrapping.
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
# The segment reader and the closed vocabularies a golden is spelled in.
pdx-core = { path = "../pdx-core", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
# The golden files, and `pdx index --json`'s report.
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
# Local Git repositories for the fetch tests, and synthetic segments.
tempfile = "3.27.0"
# The engine's list of extraction switches, which the harness's own copy must equal.
pdx-engine = { path = "../pdx-engine", version = "0.1.0" }
