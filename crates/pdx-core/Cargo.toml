[package]
name = "pdx-core"
description = "The graph model, the indexing pipeline, resolution, segments and layout."
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = true

[dependencies]
# The model's rows and identifiers serialise for segments, caches and the API.
serde = { version = "1.0.229", features = ["derive"] }
# Free-form row properties (`props`) are JSON values, kept in key order.
serde_json = "1.0.151"
# Every identity is a SHA-256 hash (4.2.1), and so is a segment's content hash.
sha2 = "0.11.0"
# Segments are SQLite files (4.3). The bundled build compiles one SQLite, the same
# version with the same options on every platform, which a byte-identical segment needs.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# A segment is built in a temporary directory, then written to its final path.
tempfile = "3.27.0"
thiserror = "2.0.21"
# Discovery: gitignore semantics for `.gitignore`, `.pdxignore` and configured
# excludes, and glob matching for secret patterns and layer rules (4.5 Stage 1).
ignore = "0.4.33"
globset = "0.4.20"
# The repository's `pdx.toml` (Appendix C).
toml = "1.1.6"
# Stage 2 extracts through the engine's safe wrapper (4.5), in process or isolated.
pdx-engine = { path = "../pdx-engine", version = "0.1.0" }
# The extraction cache's entries; the same version and features as the engine
# wrapper's, whose `FileExtract` they hold.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# Stage 2's workers: one engine per thread of a pool sized to the memory budget.
rayon = "1.12.0"
# Secret detectors (5.12), whose matching never backtracks over source.
regex = "1.13.1"
# A file's Git blob identity, and nothing else: never a security hash.
sha1 = "0.11.0"

[dev-dependencies]
insta = { version = "1.49.0", default-features = false }
# The identity properties of 4.2.1 (tests/ids.rs).
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[lints]
workspace = true
