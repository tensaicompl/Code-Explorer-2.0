[package]
name = "pdx-engine-sys"
description = "Raw bindings to the extraction engine and its build."
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = true
# One crate in a build links the engine; Cargo refuses a second.
links = "pdxe"
build = "build.rs"

[build-dependencies]
cmake = "0.1.58"
bindgen = { version = "0.73.2", optional = true }

[dev-dependencies]
# Reads the compile commands of the engine this crate built.
serde_json = "1"

[features]
# Regenerates src/bindings.rs from engine/include/pdxe.h (`make bindgen`). Needs
# libclang. Without it the committed bindings are used and libclang is not needed.
regenerate-bindings = ["dep:bindgen"]
# Compiles the engine's fault-injection switches, with which a test makes the engine
# abort on a named file or skip one in typed resolution. Each reads the environment,
# so a binary built with them can be crashed by an environment variable. For tests
# only: enable it from [dev-dependencies], never from [dependencies], and a release
# build cannot contain it.
test-seams = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
