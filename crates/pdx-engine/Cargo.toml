[package]
name = "pdx-engine"
description = "Safe wrapper over the extraction engine, with crash isolation."
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = true

[dependencies]
pdx-engine-sys = { path = "../pdx-engine-sys", version = "0.1.0" }
# The owned model is serialisable: the isolated worker sends it to the parent, and the
# extraction cache keeps it. postcard rather than the plan's bincode: decision 19.
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
thiserror = "2.0.21"

[dev-dependencies]
# The engine's fault-injection switches, for the tests that inject faults. Enabled
# here only, so no release build contains them.
pdx-engine-sys = { path = "../pdx-engine-sys", features = ["test-seams"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
