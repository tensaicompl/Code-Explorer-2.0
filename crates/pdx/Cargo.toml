[package]
name = "pdx"
description = "The command-line interface."
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[features]
default = []
# Links the enterprise crates. The public binary is built without it.
enterprise = ["dep:pdx-arch", "dep:pdx-analytics", "dep:pdx-server"]

[dependencies]
pdx-engine = { path = "../pdx-engine", version = "0.1.0" }
# `pdx index` runs the pipeline (`build_segment`), `pdx coverage` reads its segment.
pdx-core = { path = "../pdx-core", version = "0.1.0" }
# The command line (builder API only): no colour, suggestions, wrapping, environment
# arguments or derive macros, so help and errors are the same on every terminal
# (issue 70).
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
# The `--json` reports.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
pdx-arch = { path = "../pdx-arch", optional = true }
pdx-analytics = { path = "../pdx-analytics", optional = true }
pdx-server = { path = "../pdx-server", optional = true }

[dev-dependencies]
# The engine's fault-injection switches, so the isolation test can make the worker
# crash. Enabled here only, so no release build contains them.
pdx-engine-sys = { path = "../pdx-engine-sys", features = ["test-seams"] }
tempfile = "3.27.0"
# The CLI's help and report snapshots (tests/cli.rs).
insta = { version = "1.49.0", default-features = false }
