#
# Configuration comes from .env; copy .env.example and fill in the REQUIRED
# block. LOGIN_USERNAME and LOGIN_PASSWORD have no defaults on purpose: the
# backend refuses to start without them.

services:
  postgres:
    image: pgvector/pgvector:pg16
    command: postgres -c maintenance_work_mem=512MB -c shared_buffers=256MB
    environment:
      POSTGRES_DB: prx
      POSTGRES_USER: prx
      POSTGRES_PASSWORD: prx
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prx"]
      interval: 5s
      retries: 5

  indexer:
    build: ./indexer
    profiles:
      - docker-indexer
    environment:
      - DATABASE_URL=postgresql://prx:prx@postgres:5432/prx
      - CODEBASE_DIR=/data/codebase
      - EMBED_BATCH_SIZE=${EMBED_BATCH_SIZE:-128}
      - GRAPH_DIR=/data/graphs
    volumes:
      - ./codebase:/data/codebase:ro
      - graph-store:/data/graphs
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-opus-4-6}
      - DATABASE_URL=postgresql://prx:prx@postgres:5432/prx
      - CODEBASE_DIR=/data/codebase
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - USE_AZURE_AI=${USE_AZURE_AI:-false}
      - AZURE_AI_TENANT_ID=${AZURE_AI_TENANT_ID:-}
      - AZURE_AI_CLIENT_ID=${AZURE_AI_CLIENT_ID:-}
      - AZURE_AI_CLIENT_SECRET=${AZURE_AI_CLIENT_SECRET:-}
      - AZURE_AI_RESOURCE=${AZURE_AI_RESOURCE:-}
      - AZURE_AI_BASE_URL=${AZURE_AI_BASE_URL:-}
      - JIRA_SERVICE_TOKEN=${JIRA_SERVICE_TOKEN:-}
      - CONFLUENCE_TOKEN=${CONFLUENCE_TOKEN:-}
      # No defaults on purpose — the backend refuses to start without these.
      # `:?` makes Compose fail here with the message rather than starting a
      # container that will crash-loop. See .env.example.
      - LOGIN_USERNAME=${LOGIN_USERNAME:?set LOGIN_USERNAME in .env (copy .env.example)}
      - LOGIN_PASSWORD=${LOGIN_PASSWORD:?set LOGIN_PASSWORD in .env (copy .env.example)}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Alibaba-NLP/gte-base-en-v1.5}
      - API_KEYS=${API_KEYS:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - ACCESS_CONTROL_ENABLED=${ACCESS_CONTROL_ENABLED:-true}
      - PRX_CREDENTIAL_KEY=${PRX_CREDENTIAL_KEY:-}
      - PRX_SIGNAL_DIR=/data/shared
      # Where the indexer writes graphs and the backend reads them. Matches
      # store.py's own default; set explicitly so the shared volume below and
      # the code cannot silently disagree.
      - GRAPH_DIR=/data/graphs
      - SSL_CERTFILE=${SSL_CERTFILE:-}
      - SSL_KEYFILE=${SSL_KEYFILE:-}
    volumes:
      - ./codebase:/data/codebase:rw
      - refresh-signals:/data/shared
      - graph-store:/data/graphs
      # Uncomment to use custom TLS certificates:
      # - ./certs/backend.crt:/app/certs/selfsigned.crt:ro
      # - ./certs/backend.key:/app/certs/selfsigned.key:ro
    ports:
      - "3006:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
        VITE_AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
    environment:
      - BACKEND_HOST=backend
    ports:
      - "3005:443"
    depends_on:
      - backend

  cadence-indexer:
    build: ./indexer
    profiles:
      - cadence
    entrypoint: ["/bin/sh", "/app/watch-and-index.sh"]
    environment:
      - DATABASE_URL=postgresql://prx:prx@postgres:5432/prx
      - CODEBASE_DIR=/data/codebase
      - EMBED_BATCH_SIZE=${EMBED_BATCH_SIZE:-128}
      - GRAPH_DIR=/data/graphs
    volumes:
      - ./codebase:/data/codebase:ro
      - refresh-signals:/data/shared
      - graph-store:/data/graphs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  refresh-signals:
  # The graph handoff. The indexer writes graph_pass.builder's output here and
  # the backend serves it from the same path — previously the builder ran only
  # by hand, into a bind mount the backend never saw, so a rebuilt graph could
  # not reach the API at all.
  graph-store:
